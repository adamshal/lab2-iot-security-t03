CONFIG_LOG=y
CONFIG_LORA=y
CONFIG_PRINTK=y

# Crypto wrapper and secure random source (lab setup)
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_CSPRNG_NEEDED=y
CONFIG_MAIN_STACK_SIZE=8192

# Driver receive timeouts are normal while waiting; retain warnings/errors.
CONFIG_LORA_LOG_LEVEL_WRN=y
